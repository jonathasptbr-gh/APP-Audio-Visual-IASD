name: Build APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publicar Release com esta tag (ex: v1.0). Vazio = só compila.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O runner ubuntu-latest já traz o Android SDK e o JDK — nenhuma
      # infraestrutura externa é necessária para gerar o APK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do wrapper
        run: chmod +x ./gradlew

      - name: Build (debug)
        run: ./gradlew --no-daemon assembleDebug

      - name: Build (release, não assinado)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        run: ./gradlew --no-daemon assembleRelease

      # Numa release o arquivo leva o nome da versão (v1.0); fora dela, o SHA
      # curto — assim dá para saber de que commit veio um APK avulso.
      - name: Nomear o APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          mkdir -p dist
          if [ -n "$RELEASE_TAG" ]; then
            NAME="$RELEASE_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="$GITHUB_REF_NAME"
          else
            NAME="${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/audio-visual-iasd-${NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: audio-visual-iasd-apk
          path: dist/*.apk
          if-no-files-found: error

      # Uma Release dá link DIRETO para o .apk — instalar pelo artifact
      # exigiria descompactar um .zip no celular. Ela sai de uma tag `v*`
      # OU de um disparo manual com `release_tag` preenchido (nesse caso a
      # action cria a tag apontando para o commit construído).
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Baixe o `.apk` abaixo e instale pelo Chrome do celular
            (o Android vai pedir para autorizar "fontes desconhecidas").

            Conecte a TV (Smart View / MiraScreen / cabo USB-C→HDMI) e abra o
            app: o telão é detectado sozinho e recebe **só o Display**, sem
            espelhar a tela do celular. Sem TV conectada, a projeção continua
            sendo a preview do Controle em tela cheia.

            > **Assinatura de debug.** A chave muda entre execuções do CI, então
            > o Android pode recusar instalar por cima de uma versão anterior —
            > nesse caso, desinstale antes. Para uso contínuo no culto, migrar
            > para release assinado com keystore fixa.
