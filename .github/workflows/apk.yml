name: Build APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publicar Release com esta tag (ex: v1.1). Vazio = só compila.'
        required: false
        default: ''
      retag:
        description: 'Se a tag já existir, MOVER para o commit atual (apaga e recria a Release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # Publicar uma Release: por tag `v*` ou por disparo manual com release_tag.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' }}

jobs:
  # Publica a base web como bundle OTA: um push em `main` chega sozinho aos
  # aparelhos, sem APK novo (ver WebUpdater.kt). O APK continua trazendo a
  # mesma base embutida, que é o fallback offline e o piso de versão.
  web-ota:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Um grupo só, SEM cancelamento: os dois assets da release `web-latest`
    # (o zip e o version.json que carrega o sha256 dele) são substituídos um a
    # um, sem transação. Duas execuções em paralelo — o merge da branch seguido
    # de um push de correção é o caso normal — podem intercalar e deixar lá o
    # zip de uma com o sha256 da outra; a partir daí todo aparelho baixa,
    # confere o hash, e o OTA fica INERTE até o próximo push em main, sem
    # nenhum sinal (o checkAsync engole tudo em Log.i). Cancelar no meio do
    # upload produziria exatamente o mesmo estado, por isso a fila espera.
    concurrency:
      group: web-ota
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # O canal OTA publica direto para a frota: um erro de sintaxe aqui chega
      # aos aparelhos e o watchdog de boot NÃO evita o primeiro estrago —
      # `beginSession()` arma o pending e SERVE o bundle; só o lançamento
      # seguinte o descarta. Ou seja, um lançamento quebrado por aparelho,
      # garantido, e se for o do culto o operador fica sem sistema até fechar e
      # reabrir o app. `node --check` é a verificação mais barata que pega
      # justamente o caso letal (o `node` já vem no runner), e com
      # `set -euo pipefail` qualquer falha reprova o job ANTES de publicar.
      # Não substitui teste de comportamento — só garante que o bundle carrega.
      - name: Sanidade da base web (sintaxe do JS)
        run: |
          set -euo pipefail
          # `vendor/` fica de fora: é código buildado de terceiro (ESM), e o
          # `node --check` só o aceita pela detecção automática de módulo do
          # Node — uma regressão do runner bloquearia o canal OTA inteiro por
          # um arquivo que não é nosso.
          find app/src/main/assets/web -name '*.js' -not -path '*/vendor/*' -print0 |
            xargs -0 -n1 -t node --check
          python3 -c "
          import json
          m = json.load(open('app/src/main/assets/web/version.json'))
          assert m['version'] and int(m['minShell']) > 0, m
          print('version.json OK:', m)
          "
          # A versão mora em TRÊS lugares (ver CLAUDE.md), e os três precisam
          # bater: esquecer o WEB_VERSION é "o erro silencioso" (o OTA distribui
          # e o aparelho exibe a versão antiga) e esquecer o version.json é "o
          # erro mudo" (nada chega a aparelho nenhum). Até aqui a única defesa
          # era disciplina; este assert fecha a classe.
          python3 - <<'PY'
          import json, re
          raiz = 'app/src/main/assets/web'
          vjson = json.load(open(f'{raiz}/version.json'))['version']
          js = open(f'{raiz}/controle/controle.js', encoding='utf-8').read()
          vjs = re.search(r"^const WEB_VERSION = '([^']+)'", js, re.M).group(1)
          html = open(f'{raiz}/controle/index.html', encoding='utf-8').read()
          vhtml = re.search(r'id="appVersion"[^>]*>[^<]*?v([0-9][0-9.]*)<', html).group(1)
          assert vjson == vjs == vhtml, (
              f'os três lugares de versão divergem: version.json={vjson} '
              f'controle.js WEB_VERSION={vjs} index.html #appVersion={vhtml}')
          print('três lugares de versão OK:', vjson)
          PY
          # O parser do índice DASH (`sidx`) da transmissão direta. Ele entra
          # aqui, e não num framework de teste, porque é a ÚNICA peça daquele
          # caminho que se verifica sem aparelho — e porque um erro de
          # deslocamento nele não dá erro: dá vídeo que não toca, no telão, no
          # meio de um culto. O passo já existe para impedir que o canal OTA
          # publique um bundle que não carrega; isto é da mesma natureza.
          node tools/sidx.test.mjs
          # O CONTRATO do `shouldInterceptRequest`: o `InputStream` devolvido é
          # o recurso INTEIRO a partir do byte 0, e quem aplica o `Range` é o
          # WebView. Violar isso custou três rodadas de APK (v1.52 → v1.54) com
          # o CI verde o tempo todo — porque a camada que falha não existe fora
          # do aparelho. O oráculo transcreve a regra do Chromium e prova, em
          # Node puro, que a fatia crua NÃO atende e a faixa na URL atende.
          # Determinístico, sem rede e sem navegador: entra aqui, e sem
          # `continue-on-error`.
          node tools/webview-range.test.mjs

      # FUMAÇA DO CONTROLE, num Chromium de verdade. O passo acima prova que os
      # arquivos são PARSEÁVEIS; este prova que o app SOBE e responde ao toque.
      # A distinção não é acadêmica: a v5.121 saiu com o botão de copiar o
      # Registro chamando uma função que uma limpeza tinha apagado — sintaxe
      # perfeita, `node --check` verde, botão morto no aparelho.
      #
      # `continue-on-error` de propósito: um teste de navegador tem mais formas
      # de falhar por infraestrutura (download do Chromium, runner sem rede) do
      # que por defeito real, e barrar o OTA por causa disso seria trocar um
      # risco raro por um bloqueio frequente. Ele grita no log; quem lê decide.
      - name: Fumaça do Controle (Chromium)
        continue-on-error: true
        run: |
          set -euo pipefail
          npm i --no-audit --no-fund --silent playwright
          npx playwright install --with-deps chromium
          PW_CHROMIUM="" node tools/smoke.mjs
          # E as MENSAGENS DE FALHA da transmissão direta. Nelas a mensagem é o
          # produto: a transmissão roda no aparelho do operador, contra URLs que
          # expiram, e a única coisa que atravessa essa distância é a linha do
          # Registro. "Não deu" já custou duas rodadas de APK aqui.
          PW_CHROMIUM="" node tools/mse.test.mjs
          # E a TRANSIÇÃO DE ENTRADA do palco. Ela ficou anos pela metade (a
          # mídia velha esmaecia, a nova entrava no talo) e ninguém viu, porque
          # um arquivo local vira quadro em milissegundos e o corte colava no
          # fim do esmaecimento. Só a transmissão direta — com a rede inteira
          # entre o preto e o primeiro quadro — tornou a falta visível. É um
          # defeito que nenhum `--check` pega e que a congregação inteira vê.
          PW_CHROMIUM="" node tools/stage-fade.test.mjs
          # E o COLETOR DE LIXO do banco, que é o único código do app que apaga
          # mídia do operador. Um erro ali não dá tela branca: some com o vídeo
          # do domingo, em silêncio e sem desfazer.
          PW_CHROMIUM="" node tools/db-gc.test.mjs
          # E as CONTAS DA BIBLIOTECA — "esta coleção está completa?" e "quanto
          # ela ocupa?". As duas eram respondidas por fórmulas diferentes em
          # lugares diferentes da mesma tela, e o resultado era um card com o
          # botão de baixar ao lado de um chip dizendo "Completo offline". Conta
          # errada não estoura em lugar nenhum: ela só mostra o número errado.
          PW_CHROMIUM="" node tools/acervo.test.mjs
          # E O QUE A PONTE DE FATO ENTREGA. `native.js` REMONTA campo a campo
          # os objetos que manda ao Kotlin, e um campo esquecido some em
          # silêncio: do outro lado, `optBoolean`/`optLong` leem ausente como
          # `false`/`0`, que são valores legítimos. Já custou duas vezes —
          # `slideLabel` (v5.97→v5.102) e `bytes`, que nunca chegou a viajar
          # desde a versão que o criou.
          PW_CHROMIUM="" node tools/ponte.test.mjs
          # E O TELÃO, que até agora NENHUM teste tinha carregado. A fumaça
          # acima abre o Controle; o `stage-fade` monta o palco à mão. A metade
          # que roda na frente da congregação era a metade que a CI nunca
          # executou — e é a que menos rede de segurança tem, porque o watchdog
          # do OTA também não a valida (quem confirma o bundle é o Controle).
          # Ele trava, de quebra, o endereçamento do reenvio de cena: sem ele,
          # uma segunda instância do Display faz a TV recarregar a mídia.
          PW_CHROMIUM="" node tools/display-smoke.mjs
          # E OS DESTINOS das folhas de escolha. O que está marcado precisa
          # ATRAVESSAR o fechamento da folha: a ação roda depois de
          # `closeSongMenu()`, que zera o conjunto, e uma leitura tarde demais
          # devolveria só a linha tocada — o item iria para um destino em vez de
          # dois, sem erro nenhum. Mesma classe de falha muda do `slideLabel`.
          PW_CHROMIUM="" node tools/destinos.test.mjs
          # E A CENA: o que o telão mostra ao RECONECTAR, o que o operador
          # ajusta nela (girar, preencher) e o que ele lê sobre ela. A reconexão
          # do dongle é o caminho menos testável à mão — exige TV, dongle e o
          # timing de derrubá-lo — e roda sozinho na frente da congregação.
          PW_CHROMIUM="" node tools/cena.test.mjs

      - name: Empacotar a base web
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/web-assets.zip"
          META="$GITHUB_WORKSPACE/version.json"
          SRC="$GITHUB_WORKSPACE/app/src/main/assets/web/version.json"

          # O zip preserva o prefixo `web/` para que o caminho dentro do
          # bundle bata 1:1 com a URL servida pelo asset loader.
          rm -f "$ZIP"
          (cd "$GITHUB_WORKSPACE/app/src/main/assets" && zip -qr "$ZIP" web)

          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)

          python3 - "$SRC" "$META" "$SHA" "$GITHUB_REPOSITORY" <<'PY'
          import json, sys
          src, out, sha, repo = sys.argv[1:5]
          meta = json.load(open(src))
          json.dump({
              "version": meta["version"],
              "minShell": int(meta["minShell"]),
              "sha256": sha,
              "assets": f"https://github.com/{repo}/releases/download/web-latest/web-assets.zip",
          }, open(out, "w"), indent=2)
          PY

          echo "Bundle: $(du -h "$ZIP" | cut -f1)"
          cat "$META"

      # Tag fixa: a URL do bundle precisa ser estável, porque está compilada
      # no shell. Cada push substitui os dois arquivos desta mesma release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: web-latest
          name: Base web (canal OTA)
          prerelease: true
          files: |
            web-assets.zip
            version.json
          body: |
            **Infraestrutura — não é para instalar.**

            Canal de atualização da base web: o app consulta o `version.json`
            aqui e baixa o `web-assets.zip` quando há versão nova, aplicando-a
            no lançamento seguinte. Os APKs para instalar estão nas releases
            `v*`.

  apk:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` porque o versionCode sai da CONTAGEM DE COMMITS (ver
      # "Definir versão"), e um clone raso devolveria 1.
      # `ref`: num disparo manual COM release_tag, o código vem de `main` — a
      # tag/Release também nasce lá (target_commitish), e sem isto o APK podia
      # ser compilado de uma branch `claude/**` (que o `on.push` permite)
      # enquanto a tag apontava para main: binário publicado ≠ commit da tag.
      # Vazio = comportamento padrão da action (o próprio ref do evento), que é
      # o certo para push de tag, push de branch e PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag != '' && 'main' || '' }}

      # O runner ubuntu-latest já traz o Android SDK e o JDK — nenhuma
      # infraestrutura externa é necessária para gerar o APK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do wrapper
        run: chmod +x ./gradlew

      # A versão sai da tag (v1.1 → versionName 1.1). O versionCode NÃO sai
      # mais do número da execução: `github.run_number` conta por WORKFLOW, e
      # renomear o `apk.yml` (ou trocar o `name:`) reinicia a contagem em 1 —
      # o versionCode despencaria e o Android recusaria a instalação por cima
      # (INSTALL_FAILED_VERSION_DOWNGRADE), forçando desinstalar, que é a perda
      # de IndexedDB/OPFS que a keystore fixa existe para evitar. A contagem de
      # commits é monotônica de verdade e independe do nome do workflow. O
      # deslocamento de 100000 existe só para o primeiro APK desta regra ficar
      # ACIMA do último publicado pela regra antiga (o Android exige que o
      # versionCode apenas CRESÇA, e a contagem de commits pode ser menor que o
      # run_number acumulado): se algum dia um versionCode já publicado chegar
      # perto dele, aumente o deslocamento — nunca o diminua.
      - name: Definir versão
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            echo "APK_NAME=$TAG" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "VERSION_NAME=0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      # Só quando NÃO é publicação: numa Release o APK que sai é o da variante
      # release (passo abaixo), e o de debug era compilado e jogado fora —
      # minutos de runner por um arquivo que ninguém usava. O "Nomear o APK"
      # já escolhe a fonte pelo mesmo PUBLISH, então nenhum fluxo fica sem
      # arquivo.
      - name: Build (debug)
        if: env.PUBLISH != 'true'
        run: ./gradlew --no-daemon assembleDebug

      # Assinado com a keystore fixa quando os secrets existem — é o que
      # permite atualizar por cima sem desinstalar (e sem perder a biblioteca
      # do app: Cronograma, pastas sincronizadas, hinos e Bíblia baixados).
      # `-PrequireSigning=true` faz o PRÓPRIO Gradle reprovar a falta da chave:
      # é ele quem sabe se ela existe. Fora daqui (build local, PR de terceiro,
      # clone) a propriedade não é passada e o release continua caindo na
      # assinatura de debug, compilando normalmente.
      - name: Build (release assinado)
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PrequireSigning=true

      # Numa release o arquivo leva o nome da versão (v1.1); fora dela, o SHA
      # curto — assim dá para saber de que commit veio um APK avulso.
      # `SIGNED` diz apenas se o APK veio da VARIANTE release (o passo acima
      # rodou e produziu o arquivo); QUEM assinou é o passo seguinte que
      # confere, com o apksigner. Confundir as duas coisas foi exatamente o
      # defeito que existia aqui.
      - name: Nomear o APK
        run: |
          mkdir -p dist
          if [ "$PUBLISH" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
          cp "$SRC" "dist/audio-visual-iasd-${APK_NAME}.apk"
          echo "APK publicado a partir de: $SRC"

      # Checagem POSITIVA: pergunta ao apksigner QUEM assinou o APK que vai ser
      # publicado, em vez de deduzir da existência de um arquivo. A dedução
      # antiga ("existe app-release.apk logo está assinado") era código morto:
      # o build.gradle.kts atribui a signingConfig de debug quando não há
      # keystore, e o AGP só acrescenta o sufixo `-unsigned` ao nome quando a
      # variante não tem signingConfig NENHUM — o arquivo existia sempre,
      # SIGNED virava 'true' e esta etapa era PULADA. O que saía era uma
      # Release assinada com a debug.keystore gerada pelo runner naquela
      # execução: chave diferente a cada run, INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # no aparelho e, como única saída, desinstalar — apagando IndexedDB/OPFS
      # (Cronograma, pastas, hinos e Bíblia baixados).
      # A chave de debug do Android tem CN=Android Debug fixo, então o teste é
      # exato e não depende de conhecer o CN da keystore de produção.
      - name: Conferir assinatura da Release
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          # Primeiro o caso grosseiro (nem chegou a sair um APK de release), que
          # tem mensagem própria; só depois o que exige a ferramenta.
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Release pedida, mas o APK assinado não foi gerado."
            echo "Confira os secrets KEYSTORE_B64, KEY_ALIAS e KEY_PASSWORD."
            exit 1
          fi
          APK=$(ls dist/*.apk)
          # O apksigner vem no build-tools do SDK do runner; a versão instalada
          # muda com o tempo, então pega-se a mais nova em vez de fixar uma. O
          # `:-` cobre as duas variáveis porque o `set -u` transformaria uma
          # delas ausente numa falha sem explicação.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::SDK do Android não encontrado (ANDROID_HOME/ANDROID_SDK_ROOT)."
            exit 1
          fi
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::O APK da Release está assinado com a chave de DEBUG."
            echo "Instalar por cima seria recusado pelo Android (a chave de"
            echo "debug muda a cada execução do runner). Confira os secrets"
            echo "KEYSTORE_B64, KEY_ALIAS e KEY_PASSWORD."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: audio-visual-iasd-apk
          path: dist/*.apk
          if-no-files-found: error

      # Uma Release dá link DIRETO para o .apk — instalar pelo artifact
      # exigiria descompactar um .zip no celular. Num disparo manual, a
      # action cria a tag apontando para o commit construído.
      # Republicar uma tag que já existe. O `action-gh-release` NÃO move uma tag
      # existente — ela continua apontando para onde nasceu —, então apagar a
      # Release junto com a tag é o que permite recriá-la no `target_commitish`
      # abaixo. Fica atrás de um input próprio, desligado por padrão: mover uma
      # tag é destrutivo e não pode ser efeito colateral de uma publicação
      # comum, em que a tag nova simplesmente ainda não existe.
      - name: Mover a tag existente (retag)
        if: env.PUBLISH == 'true' && github.event.inputs.retag == 'true' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Apagando a Release e a tag $TAG para recriá-las em main…"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "Tag $TAG não existe — nada a mover."
          fi

      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'true'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          # `target_commitish` só é usado pela API do GitHub para CRIAR a ref
          # quando ela ainda não existe — ou seja, apenas no disparo manual com
          # `release_tag` (e no `retag`, que apaga a tag antes). No fluxo
          # documentado (`git tag v1.0 && git push --tags`) a tag JÁ EXISTE
          # quando o workflow roda, e este campo não faz nada: a Release aponta
          # para onde o `git tag` local foi feito. Quem garante a coerência no
          # disparo manual é o `checkout` com `ref: main` lá em cima — assim o
          # APK publicado vem do MESMO commit que a tag passa a apontar.
          target_commitish: main
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Baixe o `.apk` abaixo e instale pelo Chrome do celular
            (o Android vai pedir para autorizar "fontes desconhecidas").

            Conecte a TV (Smart View / MiraScreen / cabo USB-C→HDMI) e abra o
            app: o telão é detectado sozinho e recebe **só o Display**, sem
            espelhar a tela do celular. Sem TV conectada, a projeção continua
            sendo a preview do Controle em tela cheia.

            > **Atualiza por cima.** A partir da v1.1 o APK é assinado com
            > keystore fixa: instale sobre a versão anterior sem desinstalar —
            > os dados do app (Cronograma, pastas sincronizadas, hinos e
            > Bíblia baixados) são preservados.
            >
            > Vindo da **v1.0**, que saiu com assinatura de debug, esta única
            > troca ainda exige desinstalar antes.
